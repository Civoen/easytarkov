<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Easy Tarkov</title>
<style>
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-600.woff2') format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-700.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-600.woff2') format('woff2');font-weight:600;font-display:swap;}
</style>
<style>
  :root{
    --bg:#14171a;
    --panel:#1b1f1c;
    --panel-2:#20241f;
    --olive:#4a5240;
    --olive-light:#6b7358;
    --rust:#c1502e;
    --amber:#c9a227;
    --paper:#d8d2c4;
    --paper-dim:#9a9689;
    --line:#33362f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .hero{
    max-width:480px;
    width:100%;
    text-align:center;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:44px;
    color:var(--paper);
    margin:0 0 6px;
  }
  .sub{
    font-size:12.5px;
    color:var(--paper-dim);
    margin:0 0 20px;
    letter-spacing:.02em;
  }
  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:4px 10px;
    margin-bottom:14px;
  }
  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:12px 14px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--rust);}
  .search-results{
    position:absolute;
    top:100%;left:0;right:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-top:none;
    z-index:5;
    display:none;
    text-align:left;
  }
  .search-results.open{display:block;}
  .search-results div{
    padding:9px 14px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .search-results div:hover{background:var(--olive);color:var(--paper);}
  .search-results .none{cursor:default;}
  .search-results .none:hover{background:none;color:var(--paper-dim);}
  .trader-wrap{position:relative;display:inline-block;}
  .btn-row{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .trader-btn{
    background:var(--panel-2);
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:11px 20px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .trader-btn:hover{border-color:var(--rust);color:var(--paper);}
  a.trader-btn{display:inline-block;text-decoration:none;}
  .trader-menu{
    position:absolute;
    top:100%;left:0;right:0;
    margin-top:1px;
    background:var(--panel-2);
    border:1px solid var(--line);
    z-index:5;
    display:none;
    text-align:left;
  }
  .trader-menu.open{display:block;}
  .trader-menu .row{
    padding:9px 14px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .trader-menu .row:hover{background:var(--olive);color:var(--paper);}
  .raid-tray{
    position:fixed;
    bottom:0;left:16px;right:16px;
    max-width:760px;
    margin:0 auto;
    z-index:40;
    font-family:'IBM Plex Mono',monospace;
  }
  .raid-tray-bar{
    width:100%;
    background:var(--panel);
    border-top:3px solid var(--rust);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .raid-tray-toggle{
    flex:1;
    color:var(--amber);
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .raid-tray-infil{
    background:none;
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:inherit;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 12px;
    cursor:pointer;
  }
  .raid-tray-infil:hover{border-color:var(--rust);color:var(--paper);}
  .raid-tray.infil .raid-tray-panel{max-height:80vh;}
  .raid-tray.infil .raid-tray-infil{border-color:var(--danger);color:#e8a49c;}
  .raid-tray.infil .raid-tray-infil:hover{background:var(--danger);color:#fff;}
  .raid-tray.infil .raid-tray-item-head{padding:22px 24px;}
  .raid-tray.infil .raid-tray-item-name{font-size:20px;}
  .raid-tray.infil .raid-tray-item-sub{font-size:13px;}
  .raid-tray.infil .raid-tray-detail{font-size:14.5px;padding:0 24px 24px;line-height:1.8;}
  .raid-tray.infil .raid-tray-remove{font-size:12px;padding:5px 12px;}
  .raid-tray-count{
    background:var(--rust);
    color:#1a0d08;
    font-weight:600;
    padding:1px 8px;
    font-size:11px;
    margin-left:auto;
    cursor:pointer;
  }
  .raid-tray-count:hover{background:var(--danger);color:#fff;}
  .raid-tray-panel{
    display:none;
    max-height:45vh;
    overflow-y:auto;
    background:var(--bg);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    text-align:left;
  }
  .raid-tray.open .raid-tray-panel{display:block;}
  .raid-tray-item{border-bottom:1px solid var(--line);}
  .raid-tray-item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    cursor:pointer;
  }
  .raid-tray-item-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    font-size:12.5px;
    color:var(--paper);
  }
  .raid-tray-item-sub{
    font-size:10.5px;
    color:var(--paper-dim);
  }
  .raid-tray-remove{
    background:none;
    border:1px solid var(--danger);
    color:#e8a49c;
    font-size:10px;
    padding:2px 7px;
    cursor:pointer;
  }
  .raid-tray-remove:hover{background:var(--danger);color:#fff;}
  .raid-tray-detail{
    display:none;
    padding:0 16px 14px;
    font-size:11.5px;
    color:var(--paper-dim);
    line-height:1.6;
  }
  .raid-tray-item.expanded .raid-tray-detail{display:block;}
  .raid-tray-detail b{color:var(--amber);}
  .raid-tray-detail .rt-row{margin-bottom:4px;}
  .raid-tray-empty{
    padding:16px;
    text-align:center;
    font-size:11px;
    color:var(--paper-dim);
  }
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Site under construction</div>
  <h1>Easy Tarkov</h1>
  <div class="sub">A quick and easy way to progress</div>

  <div class="search-wrap">
    <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="btn-row">
    <a class="trader-btn" href="kappa.html">Kappa</a>
    <div class="trader-wrap">
      <button class="trader-btn" id="traderBtn" type="button">Select trader</button>
      <div class="trader-menu" id="traderMenu"></div>
    </div>
  </div>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script>
const TASKS = [
  { name: 'Delivery From the Past', trader: 'Prapor', level: 5, url: 'delivery_from_the_past.html' },
  { name: 'A Shooter Born in Heaven', trader: 'Mechanic', level: 14, url: 'a_shooter_born_in_heaven.html' }
];

const TASK_DETAILS = {
  'delivery_from_the_past.html': {
    location: 'Customs, Factory',
    items: [
      "Tarcone Director's office key \u2014 needed to enter, not consumed",
      'Secure folder / documents case \u2014 quest item, lost on death'
    ],
  },
  'a_shooter_born_in_heaven.html': {
    location: 'Woods, Reserve, Shoreline, Customs, Lighthouse, Streets of Tarkov, Interchange, Ground Zero',
    items: [
      'Bolt-action rifle \u2014 not consumed;',
      '5 PMC headshots required on each of the 8 maps'
    ],
  }
};

const RAID_TRAY_KEY = 'easytarkov-raidtray';

function loadTray(){
  try{
    const raw = localStorage.getItem(RAID_TRAY_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

function saveTray(list){
  try{ localStorage.setItem(RAID_TRAY_KEY, JSON.stringify(list)); }catch(e){}
}

let raidTray = loadTray();

const raidTrayEl = document.getElementById('raidTray');
const raidTrayToggle = document.getElementById('raidTrayToggle');
const raidTrayInfil = document.getElementById('raidTrayInfil');
const raidTrayPanel = document.getElementById('raidTrayPanel');
const raidTrayCount = document.getElementById('raidTrayCount');

function taskLookup(url){
  return TASKS.find(t => t.url === url) || { name: url, trader: '', level: '' };
}

function renderTray(){
  raidTrayCount.textContent = raidTray.length;
  raidTrayPanel.innerHTML = raidTray.length
    ? raidTray.map(url => {
        const t = taskLookup(url);
        const d = TASK_DETAILS[url];
        const detail = d
          ? '<div class="rt-row"><b>Location:</b> '+d.location+'</div>' +
            '<div class="rt-row"><b>Items:</b> '+d.items.join(';<br>')+'</div>' +
            '<div class="rt-row"><a href="'+url+'" style="color:var(--amber)">Open full page &rarr;</a></div>'
          : '<div class="rt-row"><a href="'+url+'" style="color:var(--amber)">Open full page &rarr;</a></div>';
        return '<div class="raid-tray-item'+(raidTrayEl.classList.contains('infil') ? ' expanded' : '')+'" data-url="'+url+'">' +
          '<div class="raid-tray-item-head">' +
            '<span><span class="raid-tray-item-name">'+t.name+'</span><br><span class="raid-tray-item-sub">'+t.trader+(t.level ? ' &middot; Level '+t.level : '')+'</span></span>' +
            '<button class="raid-tray-remove" data-url="'+url+'" type="button">Remove</button>' +
          '</div>' +
          '<div class="raid-tray-detail">'+detail+'</div>' +
        '</div>';
      }).join('')
    : '<div class="raid-tray-empty">No tasks pinned yet. Pin tasks from any task page to plan a raid.</div>';
}

raidTrayToggle.addEventListener('click', () => raidTrayEl.classList.toggle('open'));
raidTrayToggle.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); raidTrayEl.classList.toggle('open'); }
});

raidTrayCount.addEventListener('click', (e) => {
  e.stopPropagation();
  if(!raidTray.length) return;
  raidTray = [];
  saveTray(raidTray);
  renderTray();
  if(typeof updatePinBtn === 'function') updatePinBtn();
  if(typeof updatePinButtons === 'function') updatePinButtons();
});

raidTrayInfil.addEventListener('click', (e) => {
  e.stopPropagation();
  const active = raidTrayEl.classList.toggle('infil');
  if(active){
    raidTrayEl.classList.add('open');
  }else{
    raidTrayEl.classList.remove('open');
  }
  raidTrayInfil.textContent = active ? 'Exfil' : 'Infil';
  renderTray();
});

raidTrayPanel.addEventListener('click', (e) => {
  const removeBtn = e.target.closest('.raid-tray-remove');
  if(removeBtn){
    const url = removeBtn.getAttribute('data-url');
    raidTray = raidTray.filter(u => u !== url);
    saveTray(raidTray);
    renderTray();
    return;
  }
  const head = e.target.closest('.raid-tray-item-head');
  if(head) head.closest('.raid-tray-item').classList.toggle('expanded');
});

renderTray();

const searchInput = document.getElementById('taskSearch');
const searchResults = document.getElementById('searchResults');

function renderResults(query){
  const q = query.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  const matches = TASKS.filter(t => t.name.toLowerCase().includes(q));
  searchResults.innerHTML = matches.length
    ? matches.map(t => '<div data-url="'+t.url+'">'+t.name+' <span style="opacity:.6">&middot; '+t.trader+'</span></div>').join('')
    : '<div class="none">No tasks found</div>';
  searchResults.classList.add('open');
}

searchInput.addEventListener('input', (e) => renderResults(e.target.value));
searchInput.addEventListener('focus', (e) => renderResults(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});
searchResults.addEventListener('click', (e) => {
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

const TRADERS = [
  { name: 'Prapor', url: 'prapor.html' },
  { name: 'Therapist', url: 'therapist.html' },
  { name: 'Skier', url: 'skier.html' },
  { name: 'Peacekeeper', url: 'peacekeeper.html' },
  { name: 'Mechanic', url: 'mechanic.html' },
  { name: 'Ragman', url: 'ragman.html' },
  { name: 'Jaeger', url: 'jaeger.html' },
  { name: 'Fence', url: 'fence.html' },
  { name: 'Ref', url: 'ref.html' }
];
const traderBtn = document.getElementById('traderBtn');
const traderMenu = document.getElementById('traderMenu');

function renderTraderList(){
  traderMenu.innerHTML = TRADERS.map(t => '<div class="row" data-url="'+t.url+'">'+t.name+'</div>').join('');
}

traderBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = traderMenu.classList.contains('open');
  if(isOpen){ traderMenu.classList.remove('open'); return; }
  renderTraderList();
  traderMenu.classList.add('open');
});

traderMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.trader-wrap')) traderMenu.classList.remove('open');
});
</script>
</body>
</html>
