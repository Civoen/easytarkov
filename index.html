<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Easy Tarkov</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css">
<style>
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .hero{
    max-width:480px;
    width:100%;
    text-align:center;
  }
  h1{
    font-size:44px;
    letter-spacing:.08em;
    margin:0 0 6px;
  }
  .sub{
    font-size:12.5px;
    color:var(--paper-dim);
    margin:0 0 20px;
    letter-spacing:.02em;
  }
  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:4px 10px;
    margin-bottom:14px;
  }
  .search-wrap{margin:0 auto 14px;}
  .search-results{text-align:left;}
  .btn-row{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .trader-wrap{display:inline-block;}
  .trader-menu{text-align:left;}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Site under construction</div>
  <h1>Easy Tarkov</h1>
  <div class="sub">A quick and easy way to progress</div>

  <div class="search-wrap">
    <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="btn-row">
    <a class="trader-btn" href="kappa.html">Kappa</a>
    <div class="trader-wrap">
      <button class="trader-btn" id="traderBtn" type="button">Traders</button>
      <div class="trader-menu" id="traderMenu"></div>
    </div>
  </div>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
</body>
</html>
