<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Easy Tarkov</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/oswald-v57-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="site.css" as="style">
<link rel="preload" href="data.js" as="script">
<link rel="preload" href="site.js" as="script">
<link rel="stylesheet" href="site.css">
<style>
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 24px 110px;
  }
  .hero{
    max-width:640px;
    width:100%;
    text-align:center;
  }
  h1{
    font-size:68px;
    letter-spacing:.08em;
    margin:0 0 10px;
  }
  .sub{
    font-size:16px;
    color:var(--paper-dim);
    margin:0 0 28px;
    letter-spacing:.02em;
  }
  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:6px 14px;
    margin-bottom:18px;
  }
  .search-wrap{width:100%;margin:0 auto 18px;}
  .search-wrap input{
    font-size:16px;
    padding:16px 18px;
  }
  .search-results{text-align:left;}
  .search-results div{font-size:14px;padding:11px 14px;}
  .btn-row{
    position:relative;
    display:flex;
    justify-content:center;
    gap:14px;
  }
  .btn-row .trader-btn{font-size:15px;padding:14px 26px;}
  .trader-wrap{display:inline-block;}
  .trader-menu{
    position:absolute;
    top:100%;left:0;right:0;
    margin-top:10px;
    width:auto;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    background:none;
    border:none;
    max-height:none;
    overflow:visible;
    z-index:45;
  }
  .trader-menu .row{
    background:var(--panel-2);
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:11px 20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .trader-menu .row:hover{border-color:var(--rust);color:var(--paper);background:var(--panel-2);}
  .trader-menu.open{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
  }
  .kappa-progress{margin-bottom:24px;}
  .kappa-progress-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:6px;
  }
  .kappa-progress-track{
    background:var(--panel-2);
    border:1px solid var(--line);
    height:8px;
  }
  .kappa-progress-fill{
    background:var(--rust);
    height:100%;
    width:0%;
  }
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Site under construction</div>
  <h1>Easy Tarkov</h1>
  <div class="sub">A quick and easy way to progress</div>

  <div class="kappa-progress">
    <div class="kappa-progress-label">
      <span id="kappaProgressText">Overall Kappa progress: 0 of 0</span>
      <span id="kappaProgressPct">0%</span>
    </div>
    <div class="kappa-progress-track"><div class="kappa-progress-fill" id="kappaProgressFill"></div></div>
  </div>

  <div class="search-wrap">
    <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="btn-row">
    <div class="trader-wrap">
      <button class="trader-btn" id="traderBtn" type="button">Traders</button>
    </div>
    <a class="trader-btn" href="maps.html">Maps</a>
    <a class="trader-btn" href="kappa.html">Kappa</a>
    <a class="trader-btn" href="recent.html">Recent</a>
    <a class="trader-btn" href="import.html">Export/Import</a>
    <div class="trader-menu" id="traderMenu"></div>
  </div>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <button class="raid-tray-compact" id="raidTrayCompact" type="button">Show Compact</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
  let taskProgress = {};
  let itemProgress = {};
  try{ taskProgress = JSON.parse(localStorage.getItem('easytarkov-progress') || '{}'); }catch(e){}
  try{ itemProgress = JSON.parse(localStorage.getItem('easytarkov-kappa-items') || '{}'); }catch(e){}

  const totalTasks = TASKS.length;
  const doneTasks = TASKS.filter(t => taskProgress[t.url]).length;
  const totalItems = KAPPA_ITEMS.length;
  const doneItems = KAPPA_ITEMS.filter(name => itemProgress[name]).length;

  const total = totalTasks + totalItems;
  const done = doneTasks + doneItems;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('kappaProgressText').textContent = 'Overall Kappa progress: ' + done + ' of ' + total;
  document.getElementById('kappaProgressPct').textContent = pct + '%';
  const fill = document.getElementById('kappaProgressFill');
  fill.style.width = pct + '%';
  fill.style.background = pct >= 100 ? '#3cbf2d' : '';
})();
</script>
</body>
</html>
