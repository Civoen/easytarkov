<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Tarkov</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Easy Tarkov">
<meta property="og:description" content="A quick and easy way to progress through Escape from Tarkov's Kappa Container tasks.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Easy Tarkov">
<meta name="twitter:description" content="A quick and easy way to progress through Escape from Tarkov's Kappa Container tasks.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="fonts/oswald-v57-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="site.css" as="style">
<link rel="preload" href="data.js" as="script">
<link rel="preload" href="site.js" as="script">
<link rel="stylesheet" href="site.css">
<style>
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 24px 110px;
  }
  .hero{
    max-width:640px;
    width:100%;
    text-align:center;
  }
  h1{
    font-size:clamp(34px, 9vw, 68px);
    letter-spacing:.06em;
    margin:0 0 10px;
  }
  .sub{
    font-size:clamp(13px, 3vw, 16px);
    color:var(--paper-dim);
    margin:0 0 28px;
    letter-spacing:.02em;
  }
  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:6px 14px;
    margin-bottom:18px;
  }
  .search-wrap{width:100%;margin:0 auto 18px;}
  .search-wrap input{
    font-size:16px;
    padding:16px 18px;
  }
  .search-results{text-align:left;}
  .search-results div{font-size:14px;padding:11px 14px;}
  .btn-row{
    position:relative;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  .btn-row .trader-btn{font-size:clamp(12px, 3vw, 15px);padding:clamp(9px, 2.5vw, 14px) clamp(14px, 4vw, 26px);}
  .kappa-progress{margin-bottom:24px;}
  .kappa-progress-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:6px;
  }
  .kappa-progress-track{
    background:var(--panel-2);
    border:1px solid var(--line);
    height:8px;
  }
  .kappa-progress-fill{
    background:var(--rust);
    height:100%;
    width:0%;
  }
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Site under construction</div>
  <h1>Easy Tarkov</h1>
  <div class="sub">A quick and easy companion app</div>

  <div class="kappa-progress" id="kappaProgressWrap" style="display:none;">
    <div class="kappa-progress-label">
      <span id="kappaProgressText">Overall Kappa progress: 0 of 0</span>
      <span id="kappaProgressPct">0%</span>
    </div>
    <div class="kappa-progress-track"><div class="kappa-progress-fill" id="kappaProgressFill"></div></div>
  </div>

  <div class="search-wrap">
    <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="btn-row">
    <a class="trader-btn" href="traders.html">Traders</a>
    <a class="trader-btn" href="maps.html">Maps</a>
    <a class="trader-btn" href="kappa.html">Kappa</a>
    <a class="trader-btn" href="recent.html">Recent</a>
    <a class="trader-btn" href="import.html">Manage Data</a>
  </div>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <button class="raid-tray-compact" id="raidTrayCompact" type="button">Show Compact</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
  let showHomeProgress = false;
  try{ showHomeProgress = localStorage.getItem('easytarkov-show-home-progress') === '1'; }catch(e){}
  if(!showHomeProgress) return;
  document.getElementById('kappaProgressWrap').style.display = 'block';

  let taskProgress = {};
  try{ taskProgress = JSON.parse(localStorage.getItem('easytarkov-progress') || '{}'); }catch(e){}

  const total = TASKS.length;
  const done = TASKS.filter(t => taskProgress[t.url]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('kappaProgressText').textContent = 'Task progress: ' + done + ' of ' + total;
  document.getElementById('kappaProgressPct').textContent = pct + '%';
  const fill = document.getElementById('kappaProgressFill');
  fill.style.width = pct + '%';
  fill.style.background = pct >= 100 ? '#3cbf2d' : '';
})();
</script>
</body>
</html>
