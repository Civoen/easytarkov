<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Easy Tarkov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --panel:#1b1f1c;
    --panel-2:#20241f;
    --olive:#4a5240;
    --olive-light:#6b7358;
    --rust:#c1502e;
    --amber:#c9a227;
    --paper:#d8d2c4;
    --paper-dim:#9a9689;
    --line:#33362f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .hero{
    max-width:480px;
    width:100%;
    text-align:center;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:44px;
    color:var(--paper);
    margin:0 0 6px;
  }
  .sub{
    font-size:12.5px;
    color:var(--paper-dim);
    margin:0 0 20px;
    letter-spacing:.02em;
  }
  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:4px 10px;
    margin-bottom:28px;
  }
  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:12px 14px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--rust);}
  .search-results{
    position:absolute;
    top:100%;left:0;right:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-top:none;
    z-index:5;
    display:none;
    text-align:left;
  }
  .search-results.open{display:block;}
  .search-results div{
    padding:9px 14px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .search-results div:hover{background:var(--olive);color:var(--paper);}
  .search-results .none{cursor:default;}
  .search-results .none:hover{background:none;color:var(--paper-dim);}
  .trader-wrap{position:relative;display:inline-block;}
  .trader-btn{
    background:var(--panel-2);
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:11px 20px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .trader-btn:hover{border-color:var(--rust);color:var(--paper);}
  .trader-menu{
    position:absolute;
    top:100%;left:0;right:0;
    margin-top:1px;
    background:var(--panel-2);
    border:1px solid var(--line);
    z-index:5;
    display:none;
    text-align:left;
  }
  .trader-menu.open{display:block;}
  .trader-menu .row{
    padding:9px 14px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .trader-menu .row:hover{background:var(--olive);color:var(--paper);}
</style>
</head>
<body>
<div class="hero">
  <h1>Easy Tarkov</h1>
  <div class="sub">A quick and easy way to progress</div>
  <div class="badge">Site under construction</div>

  <div class="search-wrap">
    <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="trader-wrap">
    <button class="trader-btn" id="traderBtn" type="button">Select trader</button>
    <div class="trader-menu" id="traderMenu"></div>
  </div>
</div>

<script>
const TASKS = [
  { name: 'Chemical - Part 1', trader: 'Skier', url: 'chemical_part1_mockup.html' },
  { name: 'Delivery From the Past', trader: 'Prapor', url: 'delivery_from_the_past.html' }
];

const searchInput = document.getElementById('taskSearch');
const searchResults = document.getElementById('searchResults');

function renderResults(query){
  const q = query.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  const matches = TASKS.filter(t => t.name.toLowerCase().includes(q));
  searchResults.innerHTML = matches.length
    ? matches.map(t => '<div data-url="'+t.url+'">'+t.name+' <span style="opacity:.6">&middot; '+t.trader+'</span></div>').join('')
    : '<div class="none">No tasks found</div>';
  searchResults.classList.add('open');
}

searchInput.addEventListener('input', (e) => renderResults(e.target.value));
searchInput.addEventListener('focus', (e) => renderResults(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});
searchResults.addEventListener('click', (e) => {
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

const TRADERS = [
  { name: 'Prapor', url: 'prapor.html' },
  { name: 'Therapist', url: 'therapist.html' },
  { name: 'Skier', url: 'skier.html' },
  { name: 'Peacekeeper', url: 'peacekeeper.html' },
  { name: 'Mechanic', url: 'mechanic.html' },
  { name: 'Ragman', url: 'ragman.html' },
  { name: 'Jaeger', url: 'jaeger.html' },
  { name: 'Fence', url: 'fence.html' },
  { name: 'Ref', url: 'ref.html' }
];
const traderBtn = document.getElementById('traderBtn');
const traderMenu = document.getElementById('traderMenu');

function renderTraderList(){
  traderMenu.innerHTML = TRADERS.map(t => '<div class="row" data-url="'+t.url+'">'+t.name+'</div>').join('');
}

traderBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = traderMenu.classList.contains('open');
  if(isOpen){ traderMenu.classList.remove('open'); return; }
  renderTraderList();
  traderMenu.classList.add('open');
});

traderMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.trader-wrap')) traderMenu.classList.remove('open');
});
</script>
</body>
</html>
