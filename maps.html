<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maps | Field Guide</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/oswald-v57-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="site.css" as="style">
<link rel="preload" href="trader.css" as="style">
<link rel="preload" href="data.js" as="script">
<link rel="preload" href="site.js" as="script">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="trader.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="tab">Maps</span>
    <div class="topbar-right">
      <a class="trader-btn" href="index.html">Home</a>
      <a class="trader-btn" href="kappa.html">Kappa</a>
      <a class="trader-btn" href="maps.html">Maps</a>
      <div class="trader-wrap">
        <button class="trader-btn" id="traderBtn" type="button">Traders</button>
        <div class="trader-menu" id="traderMenu"></div>
      </div>
      <div class="search-wrap">
        <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>

  <header>
    <h1>Maps</h1>
    <div class="sub">View important information about each location</div>
  </header>

  <section>
    <div class="section-label">All maps</div>
    <input type="text" class="task-filter" id="mapFilter" placeholder="Search maps..." autocomplete="off">
    <div class="task-list" id="mapList"></div>
    <div class="task-filter-empty" id="mapFilterEmpty">No maps match your search.</div>
  </section>

  <footer>Map pages haven't been built yet &mdash; these links will 404 until each one is added.</footer>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <button class="raid-tray-compact" id="raidTrayCompact" type="button">Compact</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
const MAPS = [
  { name: 'Customs', url: 'customs.html' },
  { name: 'Factory', url: 'factory.html' },
  { name: 'Ground Zero', url: 'ground_zero.html' },
  { name: 'Icebreaker', url: 'icebreaker.html' },
  { name: 'Interchange', url: 'interchange.html' },
  { name: 'Lighthouse', url: 'lighthouse.html' },
  { name: 'Reserve', url: 'reserve.html' },
  { name: 'Shoreline', url: 'shoreline.html' },
  { name: 'Streets of Tarkov', url: 'streets_of_tarkov.html' },
  { name: 'Terminal', url: 'terminal.html' },
  { name: 'The Lab', url: 'the_lab.html' },
  { name: 'The Labyrinth', url: 'the_labyrinth.html' },
  { name: 'Woods', url: 'woods.html' }
];

const mapList = document.getElementById('mapList');
mapList.innerHTML = MAPS.map(m =>
  '<div class="task-row">' +
    '<a class="task-link" href="'+m.url+'" style="padding-left:16px;">' +
      '<span class="task-name">'+m.name+'</span>' +
      '<span class="task-arrow">&rarr;</span>' +
    '</a>' +
  '</div>'
).join('');

const mapFilter = document.getElementById('mapFilter');
const mapFilterEmpty = document.getElementById('mapFilterEmpty');

mapFilter.addEventListener('input', () => {
  const q = mapFilter.value.trim().toLowerCase();
  let visibleCount = 0;
  mapList.querySelectorAll('.task-row').forEach(row => {
    const name = row.querySelector('.task-name').textContent.toLowerCase();
    const match = name.includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  mapFilterEmpty.style.display = visibleCount === 0 ? 'block' : 'none';
});
</script>
</body>
</html>
