<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prapor | Kappa Container Tasks</title>
<style>
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-600.woff2') format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-700.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-600.woff2') format('woff2');font-weight:600;font-display:swap;}
</style>
<style>
  :root{
    --bg:#14171a;
    --panel:#1b1f1c;
    --panel-2:#20241f;
    --olive:#4a5240;
    --olive-light:#6b7358;
    --rust:#c1502e;
    --amber:#c9a227;
    --paper:#d8d2c4;
    --paper-dim:#9a9689;
    --line:#33362f;
    --danger:#8f2c22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    padding:32px 16px 100px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .tab{
    display:inline-block;
    background:var(--rust);
    color:#1a0d08;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.08em;
    font-size:12px;
    text-transform:uppercase;
    padding:6px 12px;
    margin-bottom:-1px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar-right{
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .trader-wrap{position:relative;}
  .trader-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:7px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .trader-btn:hover{border-color:var(--rust);}
  a.trader-btn{display:inline-block;text-decoration:none;}
  .trader-menu{
    position:absolute;
    top:100%;left:0;
    margin-top:4px;
    width:130px;
    background:var(--panel-2);
    border:1px solid var(--line);
    z-index:5;
    display:none;
  }
  .trader-menu.open{display:block;}
  .trader-menu .row{
    padding:7px 10px;
    font-size:12px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .trader-menu .row:hover{background:var(--olive);color:var(--paper);}
  .search-wrap{
    position:relative;
    width:220px;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:7px 10px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--rust);}
  .search-results{
    position:absolute;
    top:100%;left:0;right:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-top:none;
    z-index:5;
    display:none;
  }
  .search-results.open{display:block;}
  .search-results div{
    padding:7px 10px;
    font-size:12px;
    cursor:pointer;
    color:var(--paper-dim);
  }
  .search-results div:hover, .search-results div.active{
    background:var(--olive);
    color:var(--paper);
  }
  .search-results .none{cursor:default;}
  .search-results .none:hover{background:none;color:var(--paper-dim);}
  header{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--rust);
    padding:24px 24px 20px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:30px;
    margin:8px 0 4px;
    color:var(--paper);
  }
  .sub{
    font-size:12px;
    color:var(--paper-dim);
  }
  section{margin-top:28px;}
  .section-label{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:13px;
    color:var(--amber);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label:before{content:"";width:8px;height:8px;background:var(--rust);display:inline-block;}
  .task-list{display:flex;flex-direction:column;gap:10px;}
  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
  }
  .task-row:hover{border-color:var(--rust);}
  .task-check{
    flex-shrink:0;
    width:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    align-self:stretch;
    border-right:1px solid var(--line);
    cursor:pointer;
  }
  .task-check input{
    width:16px;
    height:16px;
    accent-color:var(--rust);
    cursor:pointer;
  }
  .task-link{
    flex:1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px 14px 0;
    text-decoration:none;
    color:var(--paper);
  }
  .task-row.done .task-link{opacity:.55;}
  .task-row.done .task-name{text-decoration:line-through;}
  .task-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:14px;
  }
  .task-level{
    font-size:11px;
    color:var(--paper-dim);
  }
  .task-arrow{color:var(--amber);font-size:13px;}
  .task-pin{
    flex-shrink:0;
    background:none;
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:4px 9px;
    cursor:pointer;
    margin-right:14px;
  }
  .task-pin:hover{border-color:var(--rust);color:var(--paper);}
  .task-pin.pinned{border-color:var(--amber);background:var(--olive);color:var(--paper);}
  .raid-tray{
    position:fixed;
    bottom:0;left:0;right:0;
    z-index:40;
    font-family:'IBM Plex Mono',monospace;
  }
  .raid-tray-bar{
    width:100%;
    background:var(--panel);
    border-top:3px solid var(--rust);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .raid-tray-toggle{
    flex:1;
    color:var(--amber);
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .raid-tray-infil{
    background:none;
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:inherit;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 12px;
    cursor:pointer;
  }
  .raid-tray-infil:hover{border-color:var(--rust);color:var(--paper);}
  .raid-tray.infil .raid-tray-panel{max-height:80vh;}
  .raid-tray.infil .raid-tray-infil{border-color:var(--danger);color:#e8a49c;}
  .raid-tray.infil .raid-tray-infil:hover{background:var(--danger);color:#fff;}
  .raid-tray-count{
    background:var(--rust);
    color:#1a0d08;
    font-weight:600;
    padding:1px 8px;
    font-size:11px;
    margin-left:auto;
    cursor:pointer;
  }
  .raid-tray-count:hover{background:var(--danger);color:#fff;}
  .raid-tray-panel{
    display:none;
    max-height:45vh;
    overflow-y:auto;
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .raid-tray.open .raid-tray-panel{display:block;}
  .raid-tray-item{border-bottom:1px solid var(--line);}
  .raid-tray-item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    cursor:pointer;
  }
  .raid-tray-item-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    font-size:12.5px;
    color:var(--paper);
  }
  .raid-tray-item-sub{
    font-size:10.5px;
    color:var(--paper-dim);
  }
  .raid-tray-remove{
    background:none;
    border:1px solid var(--danger);
    color:#e8a49c;
    font-size:10px;
    padding:2px 7px;
    cursor:pointer;
  }
  .raid-tray-remove:hover{background:var(--danger);color:#fff;}
  .raid-tray-detail{
    display:none;
    padding:0 16px 14px;
    font-size:11.5px;
    color:var(--paper-dim);
    line-height:1.6;
  }
  .raid-tray-item.expanded .raid-tray-detail{display:block;}
  .raid-tray-detail b{color:var(--amber);}
  .raid-tray-detail .rt-row{margin-bottom:4px;}
  .raid-tray-empty{
    padding:16px;
    text-align:center;
    font-size:11px;
    color:var(--paper-dim);
  }
  .progress-wrap{margin-bottom:20px;}
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:6px;
  }
  .progress-track{
    background:var(--panel-2);
    border:1px solid var(--line);
    height:8px;
  }
  .progress-fill{
    background:var(--rust);
    height:100%;
    width:0%;
  }
  .empty-note{
    font-size:12px;
    color:var(--paper-dim);
    border:1px dashed var(--olive-light);
    padding:16px;
    text-align:center;
  }
  footer{
    margin-top:32px;
    font-size:10.5px;
    color:var(--paper-dim);
    text-align:center;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="tab">Prapor &middot; Trader</span>
    <div class="topbar-right">
      <a class="trader-btn" href="index.html">Home</a>
      <div class="trader-wrap">
        <button class="trader-btn" id="traderBtn" type="button">Traders</button>
        <div class="trader-menu" id="traderMenu"></div>
      </div>
      <div class="search-wrap">
        <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>

  <header>
    <h1>Prapor</h1>
    <div class="sub">Kappa Container tasks</div>
  </header>

  <section>
    <div class="section-label">Required tasks</div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">0 of 0 complete</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="task-list" id="taskList"></div>
  </section>

  <footer>Task list is currently incomplete. More tasks required for Kappa will be added shortly.</footer>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script>
const TASKS = [
  { name: 'Delivery From the Past', trader: 'Prapor', level: 5, url: 'delivery_from_the_past.html' },
  { name: 'A Shooter Born in Heaven', trader: 'Mechanic', level: 14, url: 'a_shooter_born_in_heaven.html' }
];

const PAGE_TRADER = 'Prapor';
const taskList = document.getElementById('taskList');
const traderTasks = TASKS.filter(t => t.trader === PAGE_TRADER);

const TASK_DETAILS = {
  'delivery_from_the_past.html': {
    location: 'Customs, Factory',
    items: [
      "Tarcone Director's office key \u2014 needed to enter, not consumed",
      'Secure folder / documents case \u2014 quest item, lost on death'
    ],
  },
  'a_shooter_born_in_heaven.html': {
    location: 'Woods, Reserve, Shoreline, Customs, Lighthouse, Streets of Tarkov, Interchange, Ground Zero',
    items: [
      'Bolt-action rifle \u2014 not consumed;',
      '5 PMC headshots required on each of the 8 maps'
    ],
  }
};

const RAID_TRAY_KEY = 'easytarkov-raidtray';

function loadTray(){
  try{
    const raw = localStorage.getItem(RAID_TRAY_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

function saveTray(list){
  try{ localStorage.setItem(RAID_TRAY_KEY, JSON.stringify(list)); }catch(e){}
}

let raidTray = loadTray();

const raidTrayEl = document.getElementById('raidTray');
const raidTrayToggle = document.getElementById('raidTrayToggle');
const raidTrayInfil = document.getElementById('raidTrayInfil');
const raidTrayPanel = document.getElementById('raidTrayPanel');
const raidTrayCount = document.getElementById('raidTrayCount');

function taskLookup(url){
  return TASKS.find(t => t.url === url) || { name: url, trader: '', level: '' };
}

function renderTray(){
  raidTrayCount.textContent = raidTray.length;
  raidTrayPanel.innerHTML = raidTray.length
    ? raidTray.map(url => {
        const t = taskLookup(url);
        const d = TASK_DETAILS[url];
        const detail = d
          ? '<div class="rt-row"><b>Location:</b> '+d.location+'</div>' +
            '<div class="rt-row"><b>Items:</b> '+d.items.join(';<br>')+'</div>' +
            '<div class="rt-row"><a href="'+url+'" style="color:var(--amber)">Open full page &rarr;</a></div>'
          : '<div class="rt-row"><a href="'+url+'" style="color:var(--amber)">Open full page &rarr;</a></div>';
        return '<div class="raid-tray-item'+(raidTrayEl.classList.contains('infil') ? ' expanded' : '')+'" data-url="'+url+'">' +
          '<div class="raid-tray-item-head">' +
            '<span><span class="raid-tray-item-name">'+t.name+'</span><br><span class="raid-tray-item-sub">'+t.trader+(t.level ? ' &middot; Level '+t.level : '')+'</span></span>' +
            '<button class="raid-tray-remove" data-url="'+url+'" type="button">Remove</button>' +
          '</div>' +
          '<div class="raid-tray-detail">'+detail+'</div>' +
        '</div>';
      }).join('')
    : '<div class="raid-tray-empty">No tasks pinned yet. Pin tasks you\'re running together this raid.</div>';
}

raidTrayToggle.addEventListener('click', () => raidTrayEl.classList.toggle('open'));
raidTrayToggle.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); raidTrayEl.classList.toggle('open'); }
});

raidTrayCount.addEventListener('click', (e) => {
  e.stopPropagation();
  if(!raidTray.length) return;
  raidTray = [];
  saveTray(raidTray);
  renderTray();
  if(typeof updatePinBtn === 'function') updatePinBtn();
  if(typeof updatePinButtons === 'function') updatePinButtons();
});

raidTrayInfil.addEventListener('click', (e) => {
  e.stopPropagation();
  const active = raidTrayEl.classList.toggle('infil');
  if(active){
    raidTrayEl.classList.add('open');
  }else{
    raidTrayEl.classList.remove('open');
  }
  raidTrayInfil.textContent = active ? 'Exfil' : 'Infil';
  renderTray();
});

raidTrayPanel.addEventListener('click', (e) => {
  const removeBtn = e.target.closest('.raid-tray-remove');
  if(removeBtn){
    const url = removeBtn.getAttribute('data-url');
    raidTray = raidTray.filter(u => u !== url);
    saveTray(raidTray);
    renderTray();
    updatePinButtons();
    return;
  }
  const head = e.target.closest('.raid-tray-item-head');
  if(head) head.closest('.raid-tray-item').classList.toggle('expanded');
});

function togglePin(url){
  if(raidTray.includes(url)){
    raidTray = raidTray.filter(u => u !== url);
  }else{
    raidTray.push(url);
  }
  saveTray(raidTray);
  renderTray();
}

function updatePinButtons(){
  taskList.querySelectorAll('.task-pin').forEach(btn => {
    const url = btn.getAttribute('data-url');
    const pinned = raidTray.includes(url);
    btn.textContent = pinned ? '\u2713 Pinned' : '+ Pin';
    btn.classList.toggle('pinned', pinned);
  });
}

renderTray();

const PROGRESS_KEY = 'easytarkov-progress';

function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

function saveProgress(progress){
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  }catch(e){}
}

let progress = loadProgress();

function updateProgressBar(){
  const total = traderTasks.length;
  const done = traderTasks.filter(t => progress[t.url]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressText').textContent = done + ' of ' + total + ' complete';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

taskList.innerHTML = traderTasks.length
  ? traderTasks.map(t =>
      '<div class="task-row" data-url="'+t.url+'">' +
        '<label class="task-check"><input type="checkbox" data-url="'+t.url+'"></label>' +
        '<a class="task-link" href="'+t.url+'">' +
          '<span><span class="task-name">'+t.name+'</span><br><span class="task-level">Level '+t.level+'</span></span>' +
          '<span class="task-arrow">&rarr;</span>' +
        '</a>' +
        '<button class="task-pin" data-url="'+t.url+'" type="button">+ Pin</button>' +
      '</div>'
    ).join('')
  : '<div class="empty-note">No Kappa-required tasks added yet for '+PAGE_TRADER+'.</div>';

taskList.querySelectorAll('.task-check input').forEach(box => {
  const url = box.getAttribute('data-url');
  box.checked = !!progress[url];
  if(box.checked) box.closest('.task-row').classList.add('done');
  box.addEventListener('change', () => {
    progress[url] = box.checked;
    saveProgress(progress);
    box.closest('.task-row').classList.toggle('done', box.checked);
    updateProgressBar();
  });
});

taskList.querySelectorAll('.task-pin').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    togglePin(btn.getAttribute('data-url'));
    updatePinButtons();
  });
});

updatePinButtons();
updateProgressBar();

const searchInput = document.getElementById('taskSearch');
const searchResults = document.getElementById('searchResults');

function renderResults(query){
  const q = query.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  const matches = TASKS.filter(t => t.name.toLowerCase().includes(q));
  searchResults.innerHTML = matches.length
    ? matches.map(t => '<div data-url="'+t.url+'">'+t.name+' <span style="opacity:.6">&middot; '+t.trader+'</span></div>').join('')
    : '<div class="none">No tasks found</div>';
  searchResults.classList.add('open');
}

searchInput.addEventListener('input', (e) => renderResults(e.target.value));
searchInput.addEventListener('focus', (e) => renderResults(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});
searchResults.addEventListener('click', (e) => {
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

const TRADERS = [
  { name: 'Prapor', url: 'prapor.html' },
  { name: 'Therapist', url: 'therapist.html' },
  { name: 'Skier', url: 'skier.html' },
  { name: 'Peacekeeper', url: 'peacekeeper.html' },
  { name: 'Mechanic', url: 'mechanic.html' },
  { name: 'Ragman', url: 'ragman.html' },
  { name: 'Jaeger', url: 'jaeger.html' },
  { name: 'Fence', url: 'fence.html' },
  { name: 'Ref', url: 'ref.html' }
];
const traderBtn = document.getElementById('traderBtn');
const traderMenu = document.getElementById('traderMenu');

function renderTraderList(){
  traderMenu.innerHTML = TRADERS.map(t => '<div class="row" data-url="'+t.url+'">'+t.name+'</div>').join('');
}

traderBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = traderMenu.classList.contains('open');
  if(isOpen){
    traderMenu.classList.remove('open');
    return;
  }
  renderTraderList();
  traderMenu.classList.add('open');
});

traderMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  const row = e.target.closest('[data-url]');
  if(row) window.location.href = row.getAttribute('data-url');
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.trader-wrap')) traderMenu.classList.remove('open');
});
</script>
</body>
</html>
