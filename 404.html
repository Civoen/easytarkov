<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page not found | Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --panel:#1b1f1c;
    --panel-2:#20241f;
    --olive:#4a5240;
    --olive-light:#6b7358;
    --rust:#c1502e;
    --amber:#c9a227;
    --paper:#d8d2c4;
    --paper-dim:#9a9689;
    --line:#33362f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--rust);
    padding:28px 26px;
    text-align:center;
  }
  .code{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:52px;
    color:var(--rust);
    letter-spacing:.04em;
    margin:0;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:16px;
    color:var(--paper);
    margin:8px 0 6px;
  }
  p{
    font-size:12.5px;
    color:var(--paper-dim);
    line-height:1.6;
    margin:0 0 22px;
  }
  a.back-btn{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-decoration:none;
    padding:10px 18px;
    letter-spacing:.03em;
  }
  a.back-btn:hover{border-color:var(--rust);color:var(--paper);}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>This page isn't in the dossier</h1>
    <p>The task you're looking for hasn't been added yet, or the link is broken.</p>
    <a class="back-btn" href="delivery_from_the_past.html">&larr; Back to Delivery From the Past</a>
  </div>
</body>
</html>
