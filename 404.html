<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page not found | Field Guide</title>
<style>
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-600.woff2') format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'Oswald';src:url('fonts/oswald-v57-latin-700.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-600.woff2') format('woff2');font-weight:600;font-display:swap;}
</style>
<style>
  :root{
    --bg:#14171a;
    --panel:#1b1f1c;
    --panel-2:#20241f;
    --olive:#4a5240;
    --olive-light:#6b7358;
    --rust:#c1502e;
    --amber:#c9a227;
    --paper:#d8d2c4;
    --paper-dim:#9a9689;
    --line:#33362f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--rust);
    padding:28px 26px;
    text-align:center;
  }
  .code{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:52px;
    color:var(--rust);
    letter-spacing:.04em;
    margin:0;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:16px;
    color:var(--paper);
    margin:8px 0 6px;
  }
  p{
    font-size:12.5px;
    color:var(--paper-dim);
    line-height:1.6;
    margin:0 0 22px;
  }
  a.back-btn{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--olive-light);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-decoration:none;
    padding:10px 18px;
    letter-spacing:.03em;
  }
  a.back-btn:hover{border-color:var(--rust);color:var(--paper);}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>This page isn't in the dossier</h1>
    <p>The task you're looking for hasn't been added yet, or the link is broken.</p>
    <a class="back-btn" href="index.html">&larr; Back to Homepage</a>
  </div>
</body>
</html>
