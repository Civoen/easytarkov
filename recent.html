<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent | Field Guide</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Recent | Easy Tarkov">
<meta property="og:description" content="Recently viewed Escape from Tarkov tasks on this browser.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Recent | Easy Tarkov">
<meta name="twitter:description" content="Recently viewed Escape from Tarkov tasks on this browser.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="fonts/oswald-v57-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="site.css" as="style">
<link rel="preload" href="trader.css" as="style">
<link rel="preload" href="data.js" as="script">
<link rel="preload" href="site.js" as="script">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="trader.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="topbar-right">
      <a class="trader-btn" href="index.html">Home</a>
      <a class="trader-btn" href="traders.html">Traders</a>
      <a class="trader-btn" href="maps.html">Maps</a>
      <a class="trader-btn" href="kappa.html">Kappa</a>
      <a class="trader-btn" href="recent.html">Recent</a>
      <a class="trader-btn" href="import.html">Manage Data</a>
      <div class="search-wrap">
        <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>
  <div class="tab-row">
    <span class="tab">Recent</span>
  </div>

  <header>
    <h1>Recent</h1>
    <div class="sub">Tasks you've viewed recently on this browser</div>
  </header>

  <section>
    <button class="trader-btn" id="clearRecentBtn" type="button">Clear</button>
    <div class="section-label" style="margin-top:16px;">Recently viewed</div>
    <div class="task-list" id="recentList"></div>
  </section>

  <footer>Only tracks tasks viewed on this browser &mdash; nothing here is shared with other visitors.<br>Need help? Message 'Civoen' on Discord.</footer>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <button class="raid-tray-compact" id="raidTrayCompact" type="button">Show Compact</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
let recent = [];
try{ recent = JSON.parse(localStorage.getItem('easytarkov-recent') || '[]'); }catch(e){}

const recentList = document.getElementById('recentList');

function renderRecent(){
  recentList.innerHTML = recent.length
    ? recent.map(r =>
        '<div class="task-row">' +
          '<a class="task-link" href="'+r.url+'" style="padding-left:16px;">' +
            '<span><span class="task-name">'+r.name+'</span><br><span class="task-level">'+r.trader+'</span></span>' +
            '<span class="task-arrow">&rarr;</span>' +
          '</a>' +
        '</div>'
      ).join('')
    : '<div class="empty-note">No recently viewed tasks yet &mdash; visit a task page and it\'ll show up here.</div>';
}

renderRecent();

document.getElementById('clearRecentBtn').addEventListener('click', () => {
  recent = [];
  try{ localStorage.removeItem('easytarkov-recent'); }catch(e){}
  renderRecent();
});
</script>
</body>
</html>
