<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kappa Container | Required Items</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="trader.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="tab">Fence &middot; Collector</span>
    <div class="topbar-right">
      <a class="trader-btn" href="index.html">Home</a>
      <a class="trader-btn" href="kappa.html">Kappa</a>
      <div class="trader-wrap">
        <button class="trader-btn" id="traderBtn" type="button">Traders</button>
        <div class="trader-menu" id="traderMenu"></div>
      </div>
      <div class="search-wrap">
        <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>

  <header>
    <h1>Kappa Container</h1>
    <div class="sub">Items required to find in raid for Collector</div>
  </header>

  <section>
    <div class="section-label">Required items</div>
    <input type="text" class="item-filter" id="itemFilter" placeholder="Search items..." autocomplete="off">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">0 of 0 found</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="task-list" id="itemList"></div>
    <div class="item-filter-empty" id="itemFilterEmpty">No items match your search.</div>
  </section>

  <footer>All items are handover-only and must be Found in Raid. None are consumed elsewhere &mdash; safe to keep once found.</footer>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script src="trader.js"></script>
<script>
initChecklist({
  listElId: 'itemList',
  storageKey: 'easytarkov-kappa-items',
  countLabel: 'found',
  emptyMessage: 'No items listed yet.',
  items: KAPPA_ITEMS.map(name => ({
    key: name, name: name, sub: 'Found in raid \u00b7 handover', href: null, pinnable: false
  }))
});

const itemFilter = document.getElementById('itemFilter');
const itemFilterEmpty = document.getElementById('itemFilterEmpty');
const itemListEl = document.getElementById('itemList');

itemFilter.addEventListener('input', () => {
  const q = itemFilter.value.trim().toLowerCase();
  let visibleCount = 0;
  itemListEl.querySelectorAll('.task-row').forEach(row => {
    const name = row.querySelector('.task-name').textContent.toLowerCase();
    const match = name.includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  itemFilterEmpty.style.display = visibleCount === 0 ? 'block' : 'none';
});
</script>
</body>
</html>
