<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website">
<meta property="og:title" content="Traders | Easy Tarkov">
<meta property="og:description" content="Browse Kappa Container tasks by trader.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Traders | Easy Tarkov">
<meta name="twitter:description" content="Browse Kappa Container tasks by trader.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="fonts/oswald-v57-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-v57-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="site.css" as="style">
<link rel="preload" href="trader.css" as="style">
<link rel="preload" href="data.js" as="script">
<link rel="preload" href="site.js" as="script">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="trader.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="topbar-right">
      <a class="trader-btn" href="index.html">Home</a>
      <a class="trader-btn" href="traders.html">Traders</a>
      <a class="trader-btn" href="maps.html">Maps</a>
      <a class="trader-btn" href="kappa.html">Kappa</a>
      <a class="trader-btn" href="recent.html">Recent</a>
      <a class="trader-btn" href="import.html">Manage Data</a>
      <div class="search-wrap">
        <input type="text" id="taskSearch" placeholder="Search tasks..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>
  <div class="tab-row">
    <span class="tab">Traders</span>
  </div>

  <header>
    <h1>Traders</h1>
    <div class="sub">Browse Kappa Container tasks by trader</div>
  </header>

  <section>
    <div class="section-label">All traders</div>
    <input type="text" class="task-filter" id="traderFilter" placeholder="Search traders..." autocomplete="off">
    <div class="task-list" id="traderList"></div>
    <div class="task-filter-empty" id="traderFilterEmpty">No traders match your search.</div>
  </section>

  <footer>Ref has no Kappa-required tasks, so isn't listed here.<br>Need help? Message 'Civoen' on Discord.</footer>
</div>

<div class="raid-tray" id="raidTray">
  <div class="raid-tray-bar">
    <div class="raid-tray-toggle" id="raidTrayToggle" role="button" tabindex="0">
      <span>Current Raid</span>
      <button class="raid-tray-infil" id="raidTrayInfil" type="button">Infil</button>
      <button class="raid-tray-compact" id="raidTrayCompact" type="button">Show Compact</button>
      <span class="raid-tray-count" id="raidTrayCount">0</span>
    </div>
  </div>
  <div class="raid-tray-panel" id="raidTrayPanel"></div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
const traderList = document.getElementById('traderList');
traderList.innerHTML = TRADERS.map(t =>
  '<div class="task-row">' +
    '<a class="task-link" href="'+t.url+'" style="padding-left:16px;">' +
      '<span class="task-name">'+t.name+'</span>' +
      '<span class="task-arrow">&rarr;</span>' +
    '</a>' +
  '</div>'
).join('');

const traderFilter = document.getElementById('traderFilter');
const traderFilterEmpty = document.getElementById('traderFilterEmpty');

traderFilter.addEventListener('input', () => {
  const q = traderFilter.value.trim().toLowerCase();
  let visibleCount = 0;
  traderList.querySelectorAll('.task-row').forEach(row => {
    const name = row.querySelector('.task-name').textContent.toLowerCase();
    const match = name.includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  traderFilterEmpty.style.display = visibleCount === 0 ? 'block' : 'none';
});
</script>
</body>
</html>
